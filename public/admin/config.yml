local_backend: true
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main

site_url: https://your-site-url.example
logo_url: /favicon.svg

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "cards"
    label: "Cards"
    folder: "src/content/cards"
    create: true
    slug: "{{name}}"
    identifier_field: "name"
    summary: "{{name}} h[{{holographic}}] {{collection_name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Number", name: "number", widget: "string" }
      - {
          label: "ReleaseDate",
          name: "release_date",
          widget: "datetime",
          time_format: false,
        }
      - { label: "Collection Name", name: "collection_name", widget: "string" }
      - {
          label: "Image",
          name: "image",
          widget: "image",
          choose_url: true,
          required: false,
        }
      - {
          label: "First Edition",
          name: "first_edition",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Holographic",
          name: "holographic",
          widget: "boolean",
          default: false,
        }
      - { label: "Missing", name: "missing", widget: "boolean", default: false }
      - { label: "Extra", name: "extra", widget: "boolean", default: false }
      - { label: "Notes", name: "notes", widget: "markdown", required: false }

  - name: "artworks"
    label: "Artworks"
    label_singular: "Artwork"
    folder: "src/content/artworks"
    create: true
    slug: "{{fields.name}}"
    identifier_field: name
    fields:
      - {
          label: "Name",
          name: "name",
          widget: "string",
          hint: "Title of the artwork grouping",
        }
      - {
          label: "Head Artwork",
          name: "head_artwork",
          widget: "relation",
          collection: "cards",
          search_fields: ["name", "number", "collection_name"],
          value_field: "{{slug}}",
          display_fields: ["{{slug}} {{name}} {{collection_name}}"],
          hint: "💡 Tip: Open /cards-reference in another tab to see all card images. Click any slug to copy it!",
        }
      - {
          label: "Grouped Artworks",
          name: "grouped_artworks",
          widget: "list",
          summary: "Card: {{fields.card}}",
          field:
            {
              label: "Card",
              name: "card",
              widget: "relation",
              collection: "cards",
              search_fields: ["name", "number", "collection_name"],
              value_field: "{{slug}}",
              display_fields: ["{{slug}} {{name}} {{collection_name}}"],
            },
          hint: "Select all cards that share this artwork. Check the preview panel on the right to see images ➡️",
        }
      - {
          label: "Description",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Optional description of this artwork grouping",
        }
